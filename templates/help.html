<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестування – ExamTests</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-pill);
            transition: all var(--transition);
            box-shadow: none;
        }
        .tab-btn:hover {
            background: var(--bg-warm);
            color: var(--text);
            transform: none;
            box-shadow: none;
        }
        .tab-btn.active {
            background: var(--primary-light);
            color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.7;
        }
        .test-meta .badge {
            background: var(--bg-warm);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-left: 6px;
        }

        /* Стилі для заголовків категорій */
        .test-category-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            margin: 24px 0 12px;
            padding-left: 8px;
            border-left: 4px solid var(--primary);
            letter-spacing: -0.01em;
        }
        .test-category-title:first-child {
            margin-top: 0;
        }
        .test-grid {
            /* вже є в основному CSS, залишаємо */
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <a href="{{ url_for('index') }}" class="navbar-brand">
                <span>📚</span> ExamTests
            </a>
            <div class="navbar-links">
                <a href="{{ url_for('index') }}">Мої курси</a>
                <span class="nav-separator">|</span>
                <a href="{{ url_for('help') }}">Допомога</a>
            </div>
        </nav>

        <div class="card">
            <div class="page-header">
                <h1>Доступні помилки.</h1>
                <p class="subtitle">Пишіть на телеграм: @MrSyhoM</p>
            </div>


        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = document.querySelectorAll('.tab-content');

        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                tabs.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                contents.forEach(content => content.classList.remove('active'));
                document.getElementById(`tab-${tabId}`).classList.add('active');
            });
        });
    </script>
</body>
</html>
